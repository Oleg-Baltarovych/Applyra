# osv-scanner ignores (CI job `deps (osv-scanner)`). Policy = pnpm audit (docs/CONTEXT.md §6):
# every entry has the advisory id, a reason and `effectiveUntil` (expiry); on expiry the ignore stops
# applying and the gate fails again. Remove the entry as soon as a fix lands. Never widen it.
# Prefer `[[PackageOverrides]]` pinned to name + version + ecosystem over a global `[[IgnoredVulns]]`
# (which would hide the advisory on every package/version). Trade-off: it hides all vulns of that exact
# version until expiry — keep the expiry short.

[[PackageOverrides]]
# GHSA-g3hv-75wg-m249 (CVE-2026-118764): minimatch ReDoS via globparts amplification, moderate, fixed 11.0.1.
# Single path (checked 2026-11-17, `pnpm why minimatch`): 10.2.6 only via @typescript-eslint/typescript-estree
# 8.72.2 (`minimatch ^10.2.2`) — dev-time lint tooling, globs from our own config, never user input; the
# other copy is 11.0.8 (not affected). Fix: typescript-eslint + @typescript-eslint/parser >= 8.73.0
# (`minimatch ^11.0.1`), published 2026-11-16, blocked by pnpm `minimumReleaseAge` on 2026-11-17 → bump,
# then delete this entry.
name = "minimatch"
version = "10.2.6"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-12-01
reason = "GHSA-g3hv-75wg-m249: dev-only lint dependency; fix = typescript-eslint >= 8.73.0 once past minimumReleaseAge"

[[PackageOverrides]]
# GHSA-3g3m-2fjr-6pw4: glob, moderate, fixed only in 14.0.2. Single path (M0-07a, 2026-11-17):
# @testcontainers/* 12.2.1 → testcontainers → archiver 7.0.1 → archiver-utils 5.0.2 (`glob ^10`) — dev/test
# only, never in a runtime image; Testcontainers uses archiver only for copyFilesToContainer with our fixed path
# (infra/postgres/init/10-roles.sql), no user input reaches glob. Fix: a testcontainers/archiver release that
# moves archiver-utils to a fixed glob. Not forced via pnpm override (glob 10 → 14 API break inside archiver-utils).
# User decision 2026-11-17.
name = "glob"
version = "10.5.0"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-12-15
reason = "GHSA-3g3m-2fjr-6pw4: dev/test-only via testcontainers → archiver-utils 5.0.2; no user input reaches glob"

[[PackageOverrides]]
# GHSA-g3hv-75wg-m249: minimatch ReDoS, moderate, fixed 11.0.1. Same single path as glob above
# (archiver-utils 5.0.2 → glob 10.5.0 → minimatch 9.0.9); patterns come only from our own test code.
# User decision 2026-11-17.
name = "minimatch"
version = "9.0.9"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-12-15
reason = "GHSA-g3hv-75wg-m249: dev/test-only via testcontainers → archiver-utils 5.0.2 → glob 10.5.0"

[[PackageOverrides]]
# GHSA-fc5q-39xc-vjpf: picomatch ReDoS through single-branch repeated extglobs, HIGH (CVSS 8.7), affects <= 4.0.7,
# no patched release yet (checked 2026-11-17). Paths (`pnpm why picomatch -r`): dev/test tooling only — ESLint
# plugins (eslint-plugin-boundaries via @boundaries/*, typescript-eslint via tinyglobby/fdir), vite/vitest, tsup;
# better-auth reaches it only through its OPTIONAL `vitest` peer, which pnpm resolves to our dev vitest — not part of
# a production install. Patterns come from our own config files, never user input. Recheck for a picomatch >= 4.0.8 /
# 5.x release and bump; delete this entry. User decision 2026-11-17.
name = "picomatch"
version = "4.0.7"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-12-15
reason = "GHSA-fc5q-39xc-vjpf: dev/test tooling only (eslint, vite/vitest, tsup); globs from our config; no fix released"
