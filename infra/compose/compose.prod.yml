# Production stack overlay (M0-14; docs/spec/12-infra-ops.md §2–§3.2, §6, §9). Always together with compose.yml:
#   docker compose -f infra/compose/compose.yml -f infra/compose/compose.prod.yml --env-file <env> up -d
#   docker compose -f … -f … --env-file <env> run --rm migrate        (before every api rollout)
# Env: generated by infra/compose/gen-prod-env.mjs (local / CI) or rendered by deploy-prod.yml on the host.
# Own project name → own volumes; never touches the dev DB. Networks (12 §3.2):
#   edge     caddy ↔ api (caddy is the only service publishing ports). A normal bridge network, so it is ALSO the
#            api's egress (Google OAuth token endpoint, later Sentry) — a separate `outbound` network would add
#            nothing while api is on edge.
#   internal api, migrate ↔ postgres, redis — `internal: true`: no egress (migrate needs no downloads)
# Worker (M3-01): must NOT join edge (not reachable from Caddy) → gets its own egress network (`outbound`) + internal.
# Secrets reach containers as per-service environment only (never argv, no shared env_file): the api never sees the
# superuser/maintenance passwords; migrate sees only MAINTENANCE_DATABASE_URL.
name: applyra-prod

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    <<: *hardening
    # Non-root from the start (image's postgres user owns PGDATA; no gosu/capabilities needed). M0-08 CI pattern.
    user: postgres
    ports: !reset []
    networks: [internal]

  redis:
    <<: *hardening
    user: valkey
    # The password goes into a config file in tmpfs (not argv, not visible in `ps`); local dev stays password-less.
    entrypoint: [sh, -c]
    command:
      - printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf --dir /data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    read_only: true
    tmpfs: [/tmp]
    ports: !reset []
    networks: [internal]

  migrate:
    <<: *hardening
    image: ${API_IMAGE:-applyra/api:local}
    profiles: [migrate]
    # db-migrate.mjs: prisma migrate deploy as applyra_maintenance + "_prisma_migrations" REVOKE + assert.
    command: [scripts/db-migrate.mjs]
    environment:
      MAINTENANCE_DATABASE_URL: postgresql://applyra_maintenance:${APPLYRA_MAINTENANCE_PASSWORD:?set APPLYRA_MAINTENANCE_PASSWORD}@postgres:5432/applyra
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]
    restart: 'no'

  api:
    <<: *hardening
    image: ${API_IMAGE:-applyra/api:local}
    # Default command `--import=./dist/instrument.js dist/main.js` (Sentry preload). Worker (M3-01): same image,
    # `command: ["--import=./dist/instrument.js", "dist/worker.js"]`, networks internal +
    # a new `outbound` network, never edge.
    environment:
      NODE_ENV: production
      PORT: '3000'
      # One trusted hop: Caddy (it replaces any client-sent X-Forwarded-For). Cloudflare in front → M0-14b.
      TRUST_PROXY_HOPS: '1'
      DATABASE_URL: postgresql://applyra_app:${APPLYRA_APP_PASSWORD:?set APPLYRA_APP_PASSWORD}@postgres:5432/applyra
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${API_DOMAIN:?set API_DOMAIN}
      WEB_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN}
      AUTH_SIGNUP_ALLOWLIST: ${AUTH_SIGNUP_ALLOWLIST?set AUTH_SIGNUP_ALLOWLIST (may be empty)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEMO_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, internal]
    restart: unless-stopped

  caddy:
    <<: *hardening
    image: ${CADDY_IMAGE:-applyra/caddy:local}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?set ROOT_DOMAIN}
      API_ORIGIN: https://${API_DOMAIN:?set API_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    # Non-root Caddy binds 80/443 via this namespaced sysctl (file capabilities do not survive no-new-privileges).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  # Local-dev-only services of compose.yml: never started in prod (no `dev-only` profile is ever enabled). Their
  # ${MINIO_*:?} vars are still interpolated (per file, before merge) → the env generator sets unused values.
  minio:
    profiles: [dev-only]
  minio-init:
    profiles: [dev-only]
  mailpit:
    profiles: [dev-only]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
