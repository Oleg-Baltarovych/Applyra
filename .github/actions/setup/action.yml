name: Setup Node + pnpm
description: Node from package.json engines, pnpm from packageManager (no corepack, Node 25+), pnpm store cache, frozen install.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setup.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # No `version` input: pnpm/action-setup reads `packageManager` from the root package.json (no corepack: Node 25+ dropped
    # it, ADR 024).
    # TODO(M0-06b): pin every action on its full commit SHA (+ version comment), Renovate keeps them fresh.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json # engines.node
        # No store cache without an install (audit job): nothing to restore or save.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
