# CI gates: docs/spec/11-testing.md §9 (R0 column), supply chain: docs/spec/09-security-privacy.md §14,
# workflows: docs/spec/12-infra-ops.md §8.1 (ADR 022: deploy-ready is checked statically, never applied).
# Every job is meant to be a required check; keep job names stable (branch protection refers to them).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly: new advisories / leaked-secret rules hit an unchanged lockfile and history. Only the
  # supply-chain jobs run (secrets, audit, deps); SAST has its own schedule in sast.yml.
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # event_name in the key: a scheduled run on main is never queued behind / replaced by a push run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # PRs: a new push supersedes the running check. main: let every commit finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Stage 1: static checks, unit, supply chain ────────────────────────────────────────────────
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: ESLint (incl. boundaries)
        run: pnpm lint
      - name: Prettier check
        run: pnpm format:check

  typecheck:
    name: typecheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: unit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # apps/api `test` runs with `--coverage`: every src/**/*.domain.ts ≥ 90% lines + branches (per file).
      # In-process tests only; apps/api/test/integration/** (Docker) is excluded and runs in `integration`.
      - run: pnpm test

  # ── Stage 2: integration (Testcontainers) ─────────────────────────────────────────────────────
  # apps/api/test/integration/** (11-testing.md §3): one Postgres + one Valkey container per run, template DB
  # built by infra/postgres/init/10-roles.sql (+ migrations from M0-08), one DB + Redis prefix per Vitest worker.
  # ubuntu-latest has Docker; Ryuk (Testcontainers reaper) removes the containers. Credentials are generated
  # per run, nothing comes from secrets. Later: IDOR gate (M0-07b) and contract tests run here too.
  integration:
    name: integration
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ryuk image Testcontainers 12.2.1 uses by default (reaper.js), pinned by digest. Bump with testcontainers
      # (tag + digest together; M0-06b Renovate). Never set DEBUG=testcontainers* here: it may log container env.
      RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Ryuk is what removes containers when a run is killed — never run CI without it.
      - name: Require Ryuk
        run: |
          if [ -n "${TESTCONTAINERS_RYUK_DISABLED:-}" ] && [ "${TESTCONTAINERS_RYUK_DISABLED}" != "false" ]; then
            echo "::error::TESTCONTAINERS_RYUK_DISABLED is set; the integration job requires Ryuk"
            exit 1
          fi
      - run: pnpm test:integration

  # ── Stage 3: migrations (11-testing.md §5.5, §9; 12-infra-ops.md §6) ──────────────────────────
  # Runs on every PR (no path filter: a required check behind a path filter never reports and blocks the PR).
  migrations:
    name: migrations
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQUAWK_VERSION: v2.73.0 # 2026-11-15; bump version + sha256 together (asset squawk-linux-x64)
      SQUAWK_SHA256: 9ae3747ca5eafa48b4d5c535fc64b61e0735a763164193644aa6436cc97c4274
      # Same tag as apps/api/test/support/images.ts and compose (digests with M0-06b).
      POSTGRES_IMAGE: postgres:18.7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the guard and squawk diff against the base commit
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Resolve base commit
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BEFORE:-}}"
          # New branch push / manual run: no usable "before" → compare with the parent commit.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # Applied migrations are immutable (05 §9, ADR 016): any modified, deleted or renamed file fails.
      - name: Guard applied migrations
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          mb="$(git merge-base "$BASE" HEAD)"
          changed="$(git diff --name-status --no-renames "$mb" HEAD -- apps/api/prisma/migrations/ | grep -v '^A' || true)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::applied migrations are immutable — add a new migration instead"
            exit 1
          fi
      - name: squawk (added migration.sql)
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A "$(git merge-base "$BASE" HEAD)" HEAD -- 'apps/api/prisma/migrations/*/migration.sql')
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No new migrations."
            exit 0
          fi
          curl -sSfL -o "$RUNNER_TEMP/squawk" "https://github.com/sbdchd/squawk/releases/download/${SQUAWK_VERSION}/squawk-linux-x64"
          echo "${SQUAWK_SHA256}  $RUNNER_TEMP/squawk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/squawk"
          "$RUNNER_TEMP/squawk" --config .squawk.toml "${added[@]}"
      # Throwaway Postgres on 127.0.0.1 with per-run passwords (masked); role passwords reach psql via exec env.
      - name: Start Postgres + roles
        run: |
          for name in SUPERUSER APP MAINTENANCE BACKUP METRICS; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "PW_$name=$value" >> "$GITHUB_ENV"
            export "PW_$name=$value"
          done
          # Non-root (the image's postgres user owns PGDATA, so no gosu/capabilities needed). Secrets are passed as
          # `-e NAME` (value inherited from this shell's env), never in argv.
          POSTGRES_PASSWORD="$PW_SUPERUSER" docker run -d --name migrations-pg --user postgres \
            --cap-drop ALL --security-opt no-new-privileges \
            -e POSTGRES_PASSWORD -p 127.0.0.1:5432:5432 "$POSTGRES_IMAGE" >/dev/null
          for _ in $(seq 1 30); do
            docker exec migrations-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec migrations-pg psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE DATABASE applyra' -c 'CREATE DATABASE applyra_shadow' >/dev/null
          docker cp infra/postgres/init/10-roles.sql migrations-pg:/tmp/10-roles.sql
          APPLYRA_APP_PASSWORD="$PW_APP" APPLYRA_MAINTENANCE_PASSWORD="$PW_MAINTENANCE" \
            APPLYRA_BACKUP_PASSWORD="$PW_BACKUP" APPLYRA_METRICS_PASSWORD="$PW_METRICS" \
            docker exec -e APPLYRA_APP_PASSWORD -e APPLYRA_MAINTENANCE_PASSWORD -e APPLYRA_BACKUP_PASSWORD \
            -e APPLYRA_METRICS_PASSWORD migrations-pg psql -v ON_ERROR_STOP=1 -U postgres -d applyra -f /tmp/10-roles.sql
      - name: Clean apply + REVOKE (pnpm db:migrate)
        run: |
          export MAINTENANCE_DATABASE_URL="postgresql://applyra_maintenance:${PW_MAINTENANCE}@127.0.0.1:5432/applyra"
          pnpm db:migrate
      - name: Drift (migrate diff --exit-code)
        working-directory: apps/api
        run: |
          export SHADOW_DATABASE_URL="postgresql://postgres:${PW_SUPERUSER}@127.0.0.1:5432/applyra_shadow"
          export MAINTENANCE_DATABASE_URL="postgresql://applyra_maintenance:${PW_MAINTENANCE}@127.0.0.1:5432/applyra"
          pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: gitleaks scans every commit
          persist-credentials: false
      # gitleaks CLI in its official image, pinned by digest (no gitleaks-action: no licence key needed,
      # same command locally). Non-root, read-only mount; safe.directory via GIT_CONFIG_* env because git
      # rejects a checkout owned by another uid ("dubious ownership").
      # gitleaks exits 0 when git itself fails (then "0 commits scanned") — fail closed on any ERR line.
      - name: gitleaks (full history)
        run: |
          set -o pipefail
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-color --exit-code 1 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -q ' ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks could not read the git history (see ERR lines above)"
            exit 1
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false' # pnpm audit reads pnpm-lock.yaml only
      - run: pnpm audit --audit-level=high

  deps:
    name: deps (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # osv-scanner CLI in its official image, pinned by digest: same docker pattern as gitleaks, same
      # command locally. Not the reusable google/osv-scanner-action workflow: it is built around a SARIF
      # upload to code scanning (unavailable on this private repo) and adds another action to pin.
      # No severity threshold: any known vulnerability fails. Ignores only in osv-scanner.toml with
      # reason + effectiveUntil (policy: docs/CONTEXT.md §6). Exit 1 = vulns, 127/128 = error/no packages.
      # Fail closed: a lockfile parsed into 0 packages must not pass.
      - name: osv-scanner (pnpm-lock.yaml)
        run: |
          set -o pipefail
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" \
            ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source --config=/src/osv-scanner.toml --lockfile=/src/pnpm-lock.yaml 2>&1 | tee "$RUNNER_TEMP/osv.log"
          if ! grep -Eq 'found [1-9][0-9]* packages' "$RUNNER_TEMP/osv.log"; then
            echo "::error::osv-scanner extracted no packages from pnpm-lock.yaml"
            exit 1
          fi

  # SAST (Semgrep CE; CodeQL once the repo is public — ADR 023) lives in sast.yml: own weekly schedule.

  # ── Stage 4 (partial, early): workflow lint ───────────────────────────────────────────────────
  # Listed under deploy-ready (M0-14) in the AC; it is cheap, so it runs from M0-05 on.
  actionlint:
    name: actionlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint (bundles shellcheck)
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # ── Stage 4 — TODO(M0-14): `deploy-ready` job — buildx multi-arch images (linux/amd64,linux/arm64, no push
  #    on PR), `docker compose -f … config -q` for compose.yml / compose.prod.yml, deploy-prod.yml lint.
  #    TODO(M0-17): separate `terraform.yml` (PRs touching infra/terraform/**): fmt -check, init -backend=false, validate.
