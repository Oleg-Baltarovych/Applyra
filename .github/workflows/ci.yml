# CI gates in ONE job (one runner start, one setup): static checks, unit tests, supply chain (gitleaks,
# pnpm audit, osv-scanner), SAST (Semgrep CE), workflow lint.
name: CI

on:
  # PRs only: main changes only through PRs, so a second run after each merge would test the same code.
  pull_request:
  # Weekly: new advisories / leaked-secret / SAST rules hit an unchanged lockfile and history.
  # Only the supply-chain and SAST steps run then.
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A new push to a PR supersedes the running check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: gitleaks scans every commit
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: ESLint
        if: ${{ !cancelled() && env.CODE == 'true' }}
        run: pnpm lint
      - name: Prettier check
        if: ${{ !cancelled() && env.CODE == 'true' }}
        run: pnpm format:check
      - name: typecheck
        if: ${{ !cancelled() && env.CODE == 'true' }}
        run: pnpm typecheck
      - name: unit tests
        if: ${{ !cancelled() && env.CODE == 'true' }}
        run: pnpm test

      # Supply chain + SAST run on every event, and keep running after an earlier failure (`!cancelled()`)
      # so one red step does not hide the others.
      - name: pnpm audit
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high

      # gitleaks CLI in its official image, pinned by digest (no gitleaks-action: no licence key needed,
      # same command locally). Non-root, read-only mount; safe.directory via GIT_CONFIG_* env because git
      # rejects a checkout owned by another uid ("dubious ownership").
      # gitleaks exits 0 when git itself fails (then "0 commits scanned") — fail closed on any ERR line.
      - name: gitleaks (full history)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-color --exit-code 1 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -q ' ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks could not read the git history (see ERR lines above)"
            exit 1
          fi

      # osv-scanner CLI in its official image, pinned by digest: same docker pattern as gitleaks.
      # No severity threshold: any known vulnerability fails. Ignores only in osv-scanner.toml with
      # reason + effectiveUntil (policy: docs/CONTEXT.md "Supply chain"). Exit 1 = vulns, 127/128 = error/no packages.
      # Fail closed: a lockfile parsed into 0 packages must not pass.
      - name: osv-scanner (pnpm-lock.yaml)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/src:ro" \
            ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source --config=/src/osv-scanner.toml --lockfile=/src/pnpm-lock.yaml 2>&1 | tee "$RUNNER_TEMP/osv.log"
          if ! grep -Eq 'found [1-9][0-9]* packages' "$RUNNER_TEMP/osv.log"; then
            echo "::error::osv-scanner extracted no packages from pnpm-lock.yaml"
            exit 1
          fi

      # SAST: Semgrep CE CLI in its official image, pinned by digest: no login, no token, no metrics.
      # (Private repo: CodeQL needs GitHub Code Security. TODO(public): add CodeQL when the repo goes public.)
      # Non-root (HOME=/tmp), read-only source mount; only $RUNNER_TEMP is writable (JSON report).
      # Scope: apps/ + packages/ + .github/, filtered by .semgrepignore (tests are scanned).
      # Exit 1 = findings (`--error`), >= 2 = semgrep failed. Inline suppression: `nosemgrep: <rule-id>` + reason.
      - name: semgrep scan
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out" -w /src \
            semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed \
            semgrep scan --metrics=off --oss-only --error \
              --config p/typescript --config p/javascript --config p/nodejs \
              --config p/owasp-top-ten --config p/secrets --config p/github-actions \
              --json-output=/out/semgrep.json \
              apps packages .github
      # Fail closed: a scan that read no files or hit errors (parse/rule/network) must not pass as green.
      - name: semgrep guard (files scanned, no errors)
        if: ${{ !cancelled() }}
        run: |
          report="$RUNNER_TEMP/semgrep.json"
          scanned=$(jq '.paths.scanned | length' "$report")
          errors=$(jq '.errors | length' "$report")
          if ! jq -e '[.paths.scanned[] | select(startswith("apps/digest/src/"))] | length > 0' "$report" >/dev/null; then
            echo "::error::semgrep scanned nothing under apps/digest/src (scope or .semgrepignore broke)"
            exit 1
          fi
          echo "semgrep scanned ${scanned} files, ${errors} errors"
          if [ "$scanned" -eq 0 ]; then
            echo "::error::semgrep scanned 0 files"
            exit 1
          fi
          if [ "$errors" -ne 0 ]; then
            jq -r '.errors[] | "\(.level // "error"): \(.type // "") \(.message // "")"' "$report"
            echo "::error::semgrep reported ${errors} error(s)"
            exit 1
          fi

      - name: actionlint (bundles shellcheck)
        if: ${{ !cancelled() && env.CODE == 'true' }}
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
