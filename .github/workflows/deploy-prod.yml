# Production deploy (M0-14; docs/spec/12-infra-ops.md §8.2 R0 column, ADR 011, ADR 022). Dispatch-only and inert
# until hosting is decided: the guard fails unless the repo variable HOSTING_ENABLED is 'true' and the run is on main.
# Never triggered by pull_request (no secrets for forks). Images come from the M0-14b build/push job as digests.
#
# Jobs (least privilege): build-spa (no secrets: pnpm install + Vite build + _headers render → artifact) →
# deploy-host (SSH key, tailnet, OIDC; never installs or runs repo code beyond checkout) → deploy-spa (Cloudflare
# token only; pnpm install for the lockfile-pinned wrangler). Each job with `environment: production` asks for approval.
#
# Owner setup (when hosting):
#   repo vars:   HOSTING_ENABLED · API_DOMAIN (public; build-spa has no environment)
#   Environment `production`: required reviewer = author; deployment branches = `main` only (branch policy).
#     vars:    DEPLOY_HOST (Tailscale name) · ROOT_DOMAIN · APP_DOMAIN · API_DOMAIN · CF_PAGES_PROJECT
#              · TS_OAUTH_CLIENT_ID · TS_AUDIENCE · IMAGE_REPO (e.g. ghcr.io/<owner>/applyra)
#     secrets: DEPLOY_SSH_KEY · DEPLOY_SSH_KNOWN_HOSTS · POSTGRES_PASSWORD · APPLYRA_{APP,MAINTENANCE,BACKUP,METRICS}_PASSWORD
#              · REDIS_PASSWORD · BETTER_AUTH_SECRET · AUTH_SIGNUP_ALLOWLIST · GOOGLE_CLIENT_ID · GOOGLE_CLIENT_SECRET
#              · SENTRY_DSN · CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID
name: Deploy (production)

on:
  workflow_dispatch:
    inputs:
      api_digest:
        description: 'api image digest (sha256:…) from the build job'
        required: true
        type: string
      caddy_digest:
        description: 'caddy image digest (sha256:…) from the build job'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build-spa:
    name: build SPA (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Guard (hosting enabled, main only, digests well-formed)
        env:
          HOSTING_ENABLED: ${{ vars.HOSTING_ENABLED }}
          API_DIGEST: ${{ inputs.api_digest }}
          CADDY_DIGEST: ${{ inputs.caddy_digest }}
        run: |
          if [ "${HOSTING_ENABLED:-}" != "true" ]; then
            echo "::error::HOSTING_ENABLED is not 'true' — deploy is disabled until hosting is decided (ADR 022)"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploy runs only from main (got $GITHUB_REF)"
            exit 1
          fi
          for d in "$API_DIGEST" "$CADDY_DIGEST"; do
            [[ "$d" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::invalid digest input"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build SPA + render _headers
        env:
          VITE_API_URL: https://${{ vars.API_DOMAIN }}/api/v1
          VITE_AUTH_GOOGLE_ENABLED: 'true'
          API_ORIGIN: https://${{ vars.API_DOMAIN }}
        run: |
          pnpm exec turbo run build --filter=@applyra/web
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { parseHeadersFile, renderHeaders } from './apps/web/scripts/headers.mjs';
            const out = renderHeaders(readFileSync('apps/web/dist/_headers', 'utf8'), process.env);
            parseHeadersFile(out);
            writeFileSync('apps/web/dist/_headers', out);
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  deploy-host:
    name: deploy host (api, caddy)
    needs: build-spa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # Tailscale OIDC federated identity (no long-lived auth key)
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: SSH config
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$DEPLOY_HOST" > ~/.ssh/config

      # /opt/applyra/.env (0600) from Environment secrets; written via stdin, never argv. Hex/URL-safe secrets.
      - name: Render host env + compose files
        env:
          IMAGE_REPO: ${{ vars.IMAGE_REPO }}
          API_DIGEST: ${{ inputs.api_digest }}
          CADDY_DIGEST: ${{ inputs.caddy_digest }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APPLYRA_APP_PASSWORD: ${{ secrets.APPLYRA_APP_PASSWORD }}
          APPLYRA_MAINTENANCE_PASSWORD: ${{ secrets.APPLYRA_MAINTENANCE_PASSWORD }}
          APPLYRA_BACKUP_PASSWORD: ${{ secrets.APPLYRA_BACKUP_PASSWORD }}
          APPLYRA_METRICS_PASSWORD: ${{ secrets.APPLYRA_METRICS_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          AUTH_SIGNUP_ALLOWLIST: ${{ secrets.AUTH_SIGNUP_ALLOWLIST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          umask 077
          # A value with $ or a line break would be re-interpreted by compose (interpolation / a new variable).
          for name in IMAGE_REPO ROOT_DOMAIN APP_DOMAIN API_DOMAIN POSTGRES_PASSWORD APPLYRA_APP_PASSWORD \
            APPLYRA_MAINTENANCE_PASSWORD APPLYRA_BACKUP_PASSWORD APPLYRA_METRICS_PASSWORD REDIS_PASSWORD \
            BETTER_AUTH_SECRET AUTH_SIGNUP_ALLOWLIST GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SENTRY_DSN; do
            case "${!name}" in
              *'$'* | *$'\n'* | *$'\r'*) echo "::error::$name contains \$ or a line break"; exit 1 ;;
            esac
          done
          {
            echo "API_IMAGE=${IMAGE_REPO}-api@${API_DIGEST}"
            echo "CADDY_IMAGE=${IMAGE_REPO}-caddy@${CADDY_DIGEST}"
            for name in ROOT_DOMAIN APP_DOMAIN API_DOMAIN POSTGRES_PASSWORD APPLYRA_APP_PASSWORD \
              APPLYRA_MAINTENANCE_PASSWORD APPLYRA_BACKUP_PASSWORD APPLYRA_METRICS_PASSWORD REDIS_PASSWORD \
              BETTER_AUTH_SECRET AUTH_SIGNUP_ALLOWLIST GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET SENTRY_DSN; do
              printf '%s=%s\n' "$name" "${!name}"
            done
            # compose.yml interpolates the dev-only minio vars even though those services never start.
            echo "MINIO_ROOT_USER=unused-dev-only"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 32)"
          } > "$RUNNER_TEMP/prod.env"
          ssh deploy 'install -d -m 700 /opt/applyra && umask 077 && cat > /opt/applyra/.env' < "$RUNNER_TEMP/prod.env"
          rm -f "$RUNNER_TEMP/prod.env"
          tar -c infra/compose/compose.yml infra/compose/compose.prod.yml infra/postgres/init \
            | ssh deploy 'tar -x -C /opt/applyra'

      # Remote steps: quoted heredocs (nothing expands on the runner); `c` = compose with the prod files + host env.
      # TODO(M0-14b): GHCR login on the host (read-only package token) before the first pull of private images.
      - name: Pull images
        run: |
          ssh deploy 'bash -euo pipefail -s' <<'EOF'
          cd /opt/applyra
          c() { docker compose -f infra/compose/compose.yml -f infra/compose/compose.prod.yml --env-file .env "$@"; }
          c pull api caddy postgres redis
          EOF

      # Pre-deploy backup marker (12 §8.2 step 2) as the read-only `backup` role (trust on 127.0.0.1 inside the container).
      - name: Pre-deploy backup
        run: |
          ssh deploy 'bash -euo pipefail -s' <<'EOF'
          cd /opt/applyra
          c() { docker compose -f infra/compose/compose.yml -f infra/compose/compose.prod.yml --env-file .env "$@"; }
          install -d -m 700 backups
          c up -d --wait postgres redis
          umask 077
          c exec -T postgres pg_dump -h 127.0.0.1 -U backup -d applyra -Fc > "backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
          EOF

      - name: Migrate (migrate deploy + REVOKE)
        run: |
          ssh deploy 'bash -euo pipefail -s' <<'EOF'
          cd /opt/applyra
          c() { docker compose -f infra/compose/compose.yml -f infra/compose/compose.prod.yml --env-file .env "$@"; }
          c run --rm migrate
          EOF

      # R0: restart with a short downtime (12 §8.2 step 4).
      - name: Roll out api + caddy
        run: |
          ssh deploy 'bash -euo pipefail -s' <<'EOF'
          cd /opt/applyra
          c() { docker compose -f infra/compose/compose.yml -f infra/compose/compose.prod.yml --env-file .env "$@"; }
          c up -d --wait api caddy
          EOF

      - name: Smoke (/health/ready)
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          code="$(curl -sS --retry 10 --retry-all-errors --retry-delay 3 -o /dev/null -w '%{http_code}' "https://${API_DOMAIN}/health/ready")"
          [ "$code" = 200 ] || { echo "::error::/health/ready returned $code"; exit 1; }

  deploy-spa:
    name: deploy SPA (Cloudflare Pages)
    needs: [build-spa, deploy-host]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # wrangler is a root devDependency (lockfile-pinned, minimumReleaseAge); this job holds only the Cloudflare token.
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-dist

      - name: wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: pnpm exec wrangler pages deploy "$RUNNER_TEMP/web-dist" --project-name "$CF_PAGES_PROJECT" --branch main
