# SAST (ADR 023, docs/spec/12-infra-ops.md §8.1): Semgrep CE on PR, main and weekly.
# The repo is private: CodeQL needs GitHub Code Security there (and its CLI licence covers public repos only).
# TODO(public): when the repo goes public add `codeql.yml` (javascript-typescript, PR + weekly,
#   `security-events: write` on that job only) and decide whether it replaces this job or runs alongside.
# Keep the job name stable (branch protection refers to it).
name: SAST

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC: new rules in the registry packs hit unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Semgrep CE CLI in its official image, pinned by digest: no login, no token, no metrics.
      # Community registry packs are fetched anonymously from semgrep.dev. Non-root (HOME=/tmp for its
      # settings/cache), read-only source mount; only $RUNNER_TEMP is writable (JSON report).
      # Scope: apps/ + packages/ + .github/ (p/github-actions), filtered by .semgrepignore (tests are scanned; fixtures are not).
      # Exit 1 = findings (`--error`), >= 2 = semgrep failed. Inline suppression: `nosemgrep: <rule-id>`
      # plus a comment with the reason.
      - name: semgrep scan
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP:/out" -w /src \
            semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed \
            semgrep scan --metrics=off --oss-only --error \
              --config p/typescript --config p/javascript --config p/nodejs --config p/react \
              --config p/owasp-top-ten --config p/secrets --config p/github-actions \
              --json-output=/out/semgrep.json \
              apps packages .github
      # Fail closed: a scan that read no files or hit errors (parse/rule/network) must not pass as green.
      - name: guard (files scanned, no errors)
        run: |
          report="$RUNNER_TEMP/semgrep.json"
          scanned=$(jq '.paths.scanned | length' "$report")
          errors=$(jq '.errors | length' "$report")
          if ! jq -e '[.paths.scanned[] | select(startswith("apps/api/src/"))] | length > 0' "$report" >/dev/null; then
            echo "::error::semgrep scanned nothing under apps/api/src (scope or .semgrepignore broke)"
            exit 1
          fi
          echo "semgrep scanned ${scanned} files, ${errors} errors"
          if [ "$scanned" -eq 0 ]; then
            echo "::error::semgrep scanned 0 files"
            exit 1
          fi
          if [ "$errors" -ne 0 ]; then
            jq -r '.errors[] | "\(.level // "error"): \(.type // "") \(.message // "")"' "$report"
            echo "::error::semgrep reported ${errors} error(s)"
            exit 1
          fi
