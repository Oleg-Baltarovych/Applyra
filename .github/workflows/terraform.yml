# Terraform checks (M0-17; docs/spec/12-infra-ops.md §2 IaC, §8.1; ADR 011, ADR 022: deploy-ready, never applied).
# No credentials, no backend, no plan: `fmt -check -recursive`, then `init -backend=false -lockfile=readonly` +
# `validate` for every env under infra/terraform/envs/. plan (PR comment, remote state in R2) / apply — M0-13.
# Static analysis of the .tf files runs in sast.yml (Semgrep p/terraform over infra/).
#
# Path filter: a required check behind `paths` never reports on PRs that skip them, so it would block merges
# (CONTEXT M0-05). Branch protection is off (private repo, free plan), so the filter is fine for now; before making
# `terraform` a required check, drop `paths` here (validate takes < 1 min) or add an always-reporting gate job.
name: Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Official image, multi-arch index digest; tag = required_version in envs/* (Renovate group "terraform").
      TF_IMAGE: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Non-root, read-only source; providers/modules go to TF_DATA_DIR under $RUNNER_TEMP. `-lockfile=readonly`
      # fails if .terraform.lock.hcl is missing a provider or its linux_amd64 hash instead of rewriting it.
      - name: terraform fmt -check
        run: |
          docker run --rm --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/infra/terraform:/tf:ro" -w /tf \
            "$TF_IMAGE" fmt -check -recursive -diff -no-color
      - name: terraform init -backend=false + validate
        run: |
          shopt -s nullglob
          envs=(infra/terraform/envs/*/)
          if [ "${#envs[@]}" -eq 0 ]; then
            echo "::error::no env under infra/terraform/envs"
            exit 1
          fi
          for dir in "${envs[@]}"; do
            env_name=$(basename "$dir")
            echo "::group::$env_name"
            data="$RUNNER_TEMP/tf-$env_name"
            mkdir -p "$data"
            for cmd in "init -backend=false -lockfile=readonly -no-color" "validate -no-color"; do
              # shellcheck disable=SC2086 # $cmd is a fixed word list from this loop
              docker run --rm --cap-drop ALL --security-opt no-new-privileges \
                --user "$(id -u):$(id -g)" -e HOME=/tmp \
                -e TF_IN_AUTOMATION=1 -e TF_INPUT=0 -e TF_DATA_DIR=/tfdata \
                -v "$PWD/infra/terraform:/tf:ro" -v "$data:/tfdata" -w "/tf/envs/$env_name" \
                "$TF_IMAGE" $cmd
            done
            echo "::endgroup::"
          done
