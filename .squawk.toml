# squawk (migration linter) — 12-infra-ops.md §6, CI job `migrations` (M0-08). Runs on migration.sql files added
# by a PR. Version + sha256 are pinned in .github/workflows/ci.yml.
pg_version = "18.0"
# Prisma applies each migration.sql as one multi-statement script → one implicit transaction.
assume_in_transaction = true
# Every excluded rule needs a reason line here.
excluded_rules = [
  # Every Int is bounded far below 2^31 and ids are UUID v7: UserSettings days (CHECK 1..180),
  # Reminder.snoozeCount (CHECK >= 0, a handful per reminder), ImportSession.rowCount (CHECK 0..5000),
  # IdempotencyRecord.statusCode (CHECK 200..499), salaries in whole currency units (CHECK >= 0; 2^31 ≈ 2.1 bn).
  # Prisma Int = 32-bit; a column that can grow without bound (event counters, bytes, micro-USD) uses BigInt.
  "prefer-bigint-over-int",
  # CHAR(2)/CHAR(3) only for fixed-length ISO codes (country, currency; 05 D-6), each with a regex CHECK
  # (^[A-Z]{2}$ / ^[A-Z]{3}$) that also rejects a space-padded short value. Free text is always TEXT (M1-01).
  "ban-char-field",
]
